name: Build Carlos Kwai Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'kwai-android/**'
      - '.github/workflows/build-kwai-bridge.yml'

permissions:
  contents: write

concurrency:
  group: build-kwai-bridge
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK de teste
        working-directory: kwai-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          test -s kwai-android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum kwai-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK instalável
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/kwai-bridge-apk && mkdir -p /tmp/kwai-bridge-apk
          cp kwai-android/app/build/outputs/apk/debug/app-debug.apk /tmp/kwai-bridge-apk/Carlos-Kwai-Bridge.apk
          cd /tmp/kwai-bridge-apk
          sha256sum Carlos-Kwai-Bridge.apk > SHA256.txt
          cat > README.txt <<'EOF'
          Carlos Kwai Bridge
          1. Instale o APK no Android.
          2. Abra o app e ative a acessibilidade Carlos Kwai Bridge.
          3. Confirme que o app oficial Kwai está instalado e logado.
          4. Ative Publicação automática e toque em Testar pacote agora.
          EOF
          git init
          git config user.name 'Carlos Kwai Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add Carlos-Kwai-Bridge.apk SHA256.txt README.txt
          git commit -m 'Carlos Kwai Bridge APK'
          git branch -M kwai-bridge-apk
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin kwai-bridge-apk

name: Postar 7 Reels por dia no Instagram

on:
  schedule:
    # 08h, 10h, 12h, 14h, 16h, 18h e 20h em Fortaleza/Brasília (UTC-3).
    # :07, :27 e :47 são apenas oportunidades de recuperação dentro da mesma janela.
    - cron: '7,27,47 11,13,15,17,19,21,23 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.trigger'

permissions:
  contents: write

concurrency:
  group: instagram-main-seven-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GDRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1sVLfUVK2FgssbqEEQeUrrUT5z9WluAin
      AUTOMATION_PAUSED: 'false'
      PLATFORM: instagram
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar janela, credenciais e duplicação
        id: cadence
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ "$AUTOMATION_PAUSED" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$INSTAGRAM_ACCESS_TOKEN" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Token do Instagram ausente."
            exit 0
          fi
          git fetch origin "$GITHUB_REF_NAME"
          git show "origin/$GITHUB_REF_NAME:state.json" > /tmp/live-state.json 2>/dev/null || cp state.json /tmp/live-state.json
          run=$(python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          now = datetime.now(timezone.utc)
          allowed_hours = {11,13,15,17,19,21,23}
          if now.hour not in allowed_hours:
              print('false')
              raise SystemExit
          path = Path('/tmp/live-state.json')
          if path.exists():
              try:
                  value = json.loads(path.read_text(encoding='utf-8')).get('last_posted_at')
                  if value:
                      last = datetime.fromisoformat(str(value).replace('Z','+00:00')).astimezone(timezone.utc)
                      if last.date() == now.date() and last.hour == now.hour:
                          print('false')
                          raise SystemExit
              except SystemExit:
                  raise
              except Exception:
                  pass
          print('true')
          PY
          )
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Verificar ativação
        id: gate
        if: steps.cadence.outputs.run == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Python
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core jq tesseract-ocr
          sudo apt-get install -y fonts-montserrat || true
          sudo apt-get install -y tesseract-ocr-por tesseract-ocr-eng || true
          pip install -r requirements.txt

      - name: Escolher vídeo exclusivo
        id: videos
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -e
          rm -rf videos && mkdir -p videos
          gdown "$GDRIVE_FOLDER_URL" --folder --json > /tmp/all-drive-files.json
          git fetch origin "$GITHUB_REF_NAME"
          for f in state_tiktok.json state_instagram_underscore.json state_kwai.json; do
            git show "origin/$GITHUB_REF_NAME:$f" > "/tmp/$f" 2>/dev/null || true
          done
          cross=$(python - <<'PY'
          import json
          from pathlib import Path
          names=[]
          for filename in ('/tmp/state_tiktok.json','/tmp/state_instagram_underscore.json','/tmp/state_kwai.json'):
              p=Path(filename)
              if p.exists():
                  try:
                      s=json.loads(p.read_text(encoding='utf-8'))
                      for key in ('last_video','last_attempted_video'):
                          v=str(s.get(key,'')).strip()
                          if v: names.append(v)
                  except Exception: pass
          print('|'.join(dict.fromkeys(names)))
          PY
          )
          CROSS_PLATFORM_EXCLUDES="$cross" python select_video.py /tmp/all-drive-files.json > /tmp/selected.json
          count=$(jq -r '.count' /tmp/selected.json)
          if [ "$count" -eq 0 ]; then echo "has_videos=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          url=$(jq -r '.url' /tmp/selected.json)
          filename=$(jq -r '.name' /tmp/selected.json)
          idx=$(jq -r '.index' /tmp/selected.json)
          gdown "$url" -O "videos/$filename"
          echo "has_videos=true" >> "$GITHUB_OUTPUT"
          echo "total_videos=$count" >> "$GITHUB_OUTPUT"
          echo "selected_video_index=$idx" >> "$GITHUB_OUTPUT"

      - name: Analisar vídeo
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: python analyze_video.py
      - name: Aplicar estilo
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: |
          python apply_style_overrides.py
          python adaptive_placement.py
      - name: Renderizar
        id: render
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        env:
          TOTAL_VIDEOS: ${{ steps.videos.outputs.total_videos }}
          SELECTED_VIDEO_INDEX: ${{ steps.videos.outputs.selected_video_index }}
        run: python render.py
      - name: Revisar qualidade
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: python quality_gate.py

      - name: Hospedar vídeo
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/media-host && mkdir -p /tmp/media-host
          cp output/reel.mp4 /tmp/media-host/latest.mp4
          cd /tmp/media-host
          git init
          git config user.name "Carlos Reels Automation"
          git config user.email "actions@users.noreply.github.com"
          git add latest.mp4 && git commit -m "latest reel"
          git branch -M media-host
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin media-host

      - name: Revalidar duplicação antes de publicar
        id: prepublish
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        shell: bash
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          allowed=$(python3 - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          try:
              raw = subprocess.check_output(
                  ['git', 'show', f'origin/{__import__("os").environ["GITHUB_REF_NAME"]}:state.json'],
                  text=True,
              )
              value = json.loads(raw).get('last_posted_at')
              if value:
                  last = datetime.fromisoformat(str(value).replace('Z','+00:00')).astimezone(timezone.utc)
                  if last.date() == now.date() and last.hour == now.hour:
                      print('false'); raise SystemExit
          except SystemExit:
              raise
          except Exception:
              pass
          print('true')
          PY
          )
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      - name: Publicar Trial Reel
        id: publish
        continue-on-error: true
        if: steps.prepublish.outputs.allowed == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_API_VERSION: v26.0
          TRIAL_REEL: true
          PUBLIC_VIDEO_URL: https://raw.githubusercontent.com/${{ github.repository }}/media-host/latest.mp4?run=${{ github.run_id }}
        run: python publish.py

      - name: Salvar estado
        if: always() && steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Carlos Reels Automation"
          git config user.email "actions@users.noreply.github.com"
          tmpdir=$(mktemp -d)
          for file in diagnostic.json quality-report.json; do
            [ -f "$file" ] && cp "$file" "$tmpdir/$file"
          done
          if [ "${{ steps.publish.outcome }}" = "success" ] && [ -f state.json ]; then
            cp state.json "$tmpdir/state.json"
          elif [ "${{ steps.render.outcome }}" = "failure" ] && [ -f state.json ]; then
            cp state.json "$tmpdir/state.json"
          fi
          printf '{"run_id":"%s","finished_at":"%s","publish_outcome":"%s"}\\n' "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" "${{ steps.publish.outcome }}" > "$tmpdir/run-status.json"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            for file in state.json diagnostic.json quality-report.json run-status.json; do
              [ -f "$tmpdir/$file" ] && cp "$tmpdir/$file" "$file"
            done
            git add state.json run-status.json
            [ -f diagnostic.json ] && git add diagnostic.json || true
            [ -f quality-report.json ] && git add quality-report.json || true
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Finalizar Instagram $GITHUB_RUN_ID [skip ci]"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Falha ao salvar estado após três tentativas." >&2
          exit 1
      - name: Falhar se publicação falhou
        if: steps.publish.outcome == 'failure'
        run: exit 1

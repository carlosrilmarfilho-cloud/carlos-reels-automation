name: Postar Reel a cada hora

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.trigger'

permissions:
  contents: write

concurrency:
  group: instagram-reels-hourly
  cancel-in-progress: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GDRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1sVLfUVK2FgssbqEEQeUrrUT5z9WluAin
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Registrar execução
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '{"run_id":"%s","started_at":"%s","status":"running"}\n' "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > run-status.json
          git config user.name "Carlos Reels Automation"
          git config user.email "actions@users.noreply.github.com"
          git add run-status.json
          git commit -m "Registrar execução $GITHUB_RUN_ID [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Verificar ativação
        id: gate
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -z "$INSTAGRAM_ACCESS_TOKEN" ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi

      - name: Python
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências de edição e análise
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core jq tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
          pip install -r requirements.txt

      - name: Escolher e baixar um vídeo sem repetir
        id: videos
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -e
          rm -rf videos && mkdir -p videos
          gdown "$GDRIVE_FOLDER_URL" --folder --json > /tmp/all-drive-files.json
          python select_video.py /tmp/all-drive-files.json > /tmp/selected.json
          count=$(jq -r '.count' /tmp/selected.json)
          echo "Vídeos únicos disponíveis: $count"
          if [ "$count" -eq 0 ]; then
            echo "has_videos=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url=$(jq -r '.url' /tmp/selected.json)
          filename=$(jq -r '.name' /tmp/selected.json)
          idx=$(jq -r '.index' /tmp/selected.json)
          echo "Selecionado [$((idx+1))/$count]: $filename"
          gdown "$url" -O "videos/$filename"
          echo "has_videos=true" >> "$GITHUB_OUTPUT"
          echo "total_videos=$count" >> "$GITHUB_OUTPUT"

      - name: Ler texto e tema do vídeo
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: python analyze_video.py

      - name: Renderizar em alta qualidade, variar texto, legenda e hashtags
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        env:
          TOTAL_VIDEOS: ${{ steps.videos.outputs.total_videos }}
        run: python render.py

      - name: Hospedar vídeo temporário
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/media-host && mkdir -p /tmp/media-host
          cp output/reel.mp4 /tmp/media-host/latest.mp4
          cd /tmp/media-host
          git init
          git config user.name "Carlos Reels Automation"
          git config user.email "actions@users.noreply.github.com"
          git add latest.mp4 && git commit -m "latest reel"
          git branch -M media-host
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin media-host

      - name: Publicar Trial Reel no Instagram
        id: publish
        continue-on-error: true
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_API_VERSION: v26.0
          TRIAL_REEL: true
          PUBLIC_VIDEO_URL: https://raw.githubusercontent.com/${{ github.repository }}/media-host/latest.mp4?run=${{ github.run_id }}
        run: python publish.py

      - name: Salvar diagnóstico e estado
        if: always() && steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "Carlos Reels Automation"
          git config user.email "actions@users.noreply.github.com"
          [ -f diagnostic.json ] && git add diagnostic.json || true
          if [ "${{ steps.publish.outcome }}" = "success" ]; then git add state.json; fi
          printf '{"run_id":"%s","finished_at":"%s","publish_outcome":"%s"}\n' "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" "${{ steps.publish.outcome }}" > run-status.json
          git add run-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Finalizar execução $GITHUB_RUN_ID [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Falhar se a publicação falhou
        if: steps.publish.outcome == 'failure'
        run: exit 1

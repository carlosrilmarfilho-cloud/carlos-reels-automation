name: Postar TikTok a cada hora

on:
  schedule:
    # Três oportunidades por hora. O guard abaixo impede duplicação e recupera cron perdido.
    - cron: '17,37,57 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.trigger-tiktok'

permissions:
  contents: write

concurrency:
  # Compartilha a fila com o Instagram para que o segundo workflow leia o
  # estado cruzado já atualizado e nunca escolha o mesmo vídeo no mesmo ciclo.
  group: instagram-tiktok-publishing
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GDRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1sVLfUVK2FgssbqEEQeUrrUT5z9WluAin
      TIKTOK_AUTOMATION_PAUSED: 'false'
      PLATFORM: tiktok

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pré-validar pausa, credenciais e cadência
        id: cadence
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$TIKTOK_AUTOMATION_PAUSED" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "TikTok pausado."
            exit 0
          fi

          if [ -z "$BUFFER_API_KEY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "BUFFER_API_KEY ausente."
            exit 0
          fi

          if [ "$EVENT_NAME" = "schedule" ]; then
            recent=$(python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("state_tiktok.json")
          recent = False
          if path.exists():
              try:
                  value = json.loads(path.read_text(encoding="utf-8")).get("last_posted_at")
                  if value:
                      last = datetime.fromisoformat(str(value).replace("Z", "+00:00")).astimezone(timezone.utc)
                      age = (datetime.now(timezone.utc) - last).total_seconds()
                      recent = 0 <= age < 45 * 60
              except Exception:
                  recent = False
          print("true" if recent else "false")
          PY
            )
            if [ "$recent" = "true" ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Fallback ignorado: TikTok confirmado nos últimos 45 minutos."
              exit 0
            fi
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Verificar ativação
        id: gate
        if: steps.cadence.outputs.run == 'true'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        shell: bash
        run: |
          if [ "$TIKTOK_AUTOMATION_PAUSED" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "TikTok pausado."
          elif [ -z "$BUFFER_API_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "BUFFER_API_KEY ausente; nenhuma publicação será tentada."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Python
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências de edição
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core jq tesseract-ocr
          sudo apt-get install -y fonts-montserrat || true
          sudo apt-get install -y tesseract-ocr-por tesseract-ocr-eng || true
          pip install -r requirements.txt

      - name: Preparar estado exclusivo e exclusões do TikTok
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          cross=$(python - <<'PY'
          import json
          from pathlib import Path
          names = []
          for filename in ("state.json", "state_kwai.json"):
              path = Path(filename)
              if path.exists():
                  try:
                      value = str(json.loads(path.read_text(encoding="utf-8")).get("last_video", "")).strip()
                      if value:
                          names.append(value)
                  except Exception:
                      pass
          print("|".join(dict.fromkeys(names)))
          PY
          )
          echo "CROSS_PLATFORM_EXCLUDES=$cross" >> "$GITHUB_ENV"
          cp state_tiktok.json state.json

      - name: Escolher e baixar um vídeo diferente das outras plataformas
        id: videos
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -e
          rm -rf videos && mkdir -p videos
          gdown "$GDRIVE_FOLDER_URL" --folder --json > /tmp/all-drive-files.json
          python select_video.py /tmp/all-drive-files.json > /tmp/selected.json
          count=$(jq -r '.count' /tmp/selected.json)
          echo "Vídeos únicos disponíveis: $count"
          if [ "$count" -eq 0 ]; then
            echo "has_videos=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url=$(jq -r '.url' /tmp/selected.json)
          filename=$(jq -r '.name' /tmp/selected.json)
          idx=$(jq -r '.index' /tmp/selected.json)
          echo "Selecionado [$((idx+1))/$count]: $filename"
          gdown "$url" -O "videos/$filename"
          echo "has_videos=true" >> "$GITHUB_OUTPUT"
          echo "total_videos=$count" >> "$GITHUB_OUTPUT"
          echo "selected_video_index=$idx" >> "$GITHUB_OUTPUT"

      - name: Ler texto, tema e rosto do vídeo
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: python analyze_video.py

      - name: Aplicar voz autoral e baixar posição da frase
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: python apply_style_overrides.py

      - name: Procurar posição segura adaptativamente
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: python adaptive_placement.py

      - name: Renderizar preservando rosto e substituindo texto antigo
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        env:
          TOTAL_VIDEOS: ${{ steps.videos.outputs.total_videos }}
          SELECTED_VIDEO_INDEX: ${{ steps.videos.outputs.selected_video_index }}
        run: python render.py

      - name: Revisar rosto, enquadramento, duplicação e linguagem
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: python quality_gate.py

      - name: Hospedar vídeo temporário para o Buffer
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/tiktok-media-host && mkdir -p /tmp/tiktok-media-host
          cp output/reel.mp4 /tmp/tiktok-media-host/latest.mp4
          cd /tmp/tiktok-media-host
          git init
          git config user.name "Carlos TikTok Automation"
          git config user.email "actions@users.noreply.github.com"
          git add latest.mp4 && git commit -m "latest tiktok"
          git branch -M media-host-tiktok
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin media-host-tiktok

      - name: Publicar automaticamente no TikTok via Buffer
        id: publish
        continue-on-error: true
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          PUBLIC_VIDEO_URL: https://raw.githubusercontent.com/${{ github.repository }}/media-host-tiktok/latest.mp4?run=${{ github.run_id }}
        run: python publish_tiktok.py

      - name: Salvar diagnóstico e estado do TikTok
        if: always() && steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          tmpdir=$(mktemp -d)

          # O estado só avança após publish_tiktok.py confirmar status "sent" no Buffer.
          # Se a publicação não chegou a ser tentada porque o vídeo foi bloqueado antes,
          # preservamos o avanço/bloqueio calculado em state.json.
          if [ "${{ steps.publish.outcome }}" = "skipped" ] && [ -f state.json ]; then
            cp state.json state_tiktok.json
          fi

          [ -f tiktok-diagnostic.json ] && cp tiktok-diagnostic.json "$tmpdir/tiktok-diagnostic.json" || true
          [ -f state_tiktok.json ] && cp state_tiktok.json "$tmpdir/state_tiktok.json" || true
          [ -f quality-report.json ] && cp quality-report.json "$tmpdir/tiktok-quality-report.json" || true
          printf '{"run_id":"%s","finished_at":"%s","publish_outcome":"%s"}\n' \
            "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" "${{ steps.publish.outcome }}" \
            > "$tmpdir/tiktok-run-status.json"

          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"

          [ -f "$tmpdir/tiktok-diagnostic.json" ] && cp "$tmpdir/tiktok-diagnostic.json" tiktok-diagnostic.json || true
          [ -f "$tmpdir/state_tiktok.json" ] && cp "$tmpdir/state_tiktok.json" state_tiktok.json || true
          [ -f "$tmpdir/tiktok-quality-report.json" ] && cp "$tmpdir/tiktok-quality-report.json" tiktok-quality-report.json || true
          cp "$tmpdir/tiktok-run-status.json" tiktok-run-status.json

          git config user.name "Carlos TikTok Automation"
          git config user.email "actions@users.noreply.github.com"
          [ -f tiktok-diagnostic.json ] && git add tiktok-diagnostic.json || true
          [ -f state_tiktok.json ] && git add state_tiktok.json || true
          [ -f tiktok-quality-report.json ] && git add tiktok-quality-report.json || true
          git add tiktok-run-status.json

          if ! git diff --cached --quiet; then
            git commit -m "Finalizar TikTok $GITHUB_RUN_ID [skip ci]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Falhar se a publicação falhou
        if: steps.publish.outcome == 'failure'
        run: exit 1

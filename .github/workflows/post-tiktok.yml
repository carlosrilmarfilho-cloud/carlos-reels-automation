name: Postar 7 TikToks por dia

on:
  schedule:
    # 08h, 10h, 12h, 14h, 16h, 18h e 20h em Fortaleza/Brasília (UTC-3).
    # :17, :37 e :57 são apenas oportunidades de recuperação dentro da mesma janela.
    - cron: '17,37,57 11,13,15,17,19,21,23 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.trigger-tiktok'

permissions:
  contents: write

concurrency:
  group: tiktok-seven-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GDRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1sVLfUVK2FgssbqEEQeUrrUT5z9WluAin
      TIKTOK_AUTOMATION_PAUSED: 'false'
      PLATFORM: tiktok
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar janela, cooldown, credenciais e duplicação
        id: cadence
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        shell: bash
        run: |
          if [ "$TIKTOK_AUTOMATION_PAUSED" = "true" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$BUFFER_API_KEY" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "BUFFER_API_KEY ausente."; exit 0; fi
          run=$(python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          now=datetime.now(timezone.utc)
          allowed={11,13,15,17,19,21,23}
          if now.hour not in allowed:
              print('false'); raise SystemExit
          diag=Path('tiktok-diagnostic.json')
          if diag.exists():
              try:
                  d=json.loads(diag.read_text(encoding='utf-8'))
                  err=str(d.get('error','')).lower()
                  cooldown_until=d.get('cooldown_until')
                  if cooldown_until:
                      until=datetime.fromisoformat(str(cooldown_until).replace('Z','+00:00')).astimezone(timezone.utc)
                      if now < until:
                          print('false'); raise SystemExit
                  else:
                      finished=d.get('finished_at')
                      limited=('wait 24 hours' in err or 'large number of posts published through the api' in err or 'rate limit' in err)
                      if limited and finished:
                          failed=datetime.fromisoformat(str(finished).replace('Z','+00:00')).astimezone(timezone.utc)
                          if now < failed + timedelta(hours=24):
                              print('false'); raise SystemExit
              except SystemExit: raise
              except Exception: pass
          state=Path('state_tiktok.json')
          if state.exists():
              try:
                  value=json.loads(state.read_text(encoding='utf-8')).get('last_posted_at')
                  if value:
                      last=datetime.fromisoformat(str(value).replace('Z','+00:00')).astimezone(timezone.utc)
                      if last.date()==now.date() and last.hour==now.hour:
                          print('false'); raise SystemExit
              except SystemExit: raise
              except Exception: pass
          print('true')
          PY
          )
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Verificar ativação
        id: gate
        if: steps.cadence.outputs.run == 'true'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Python
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core jq tesseract-ocr
          sudo apt-get install -y fonts-montserrat || true
          sudo apt-get install -y tesseract-ocr-por tesseract-ocr-eng || true
          pip install -r requirements.txt

      - name: Preparar estado e exclusões
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          for f in state.json state_instagram_underscore.json state_kwai.json; do
            git show "origin/$GITHUB_REF_NAME:$f" > "/tmp/$f" 2>/dev/null || true
          done
          cross=$(python - <<'PY'
          import json
          from pathlib import Path
          names=[]
          for filename in ('/tmp/state.json','/tmp/state_instagram_underscore.json','/tmp/state_kwai.json'):
              p=Path(filename)
              if p.exists():
                  try:
                      s=json.loads(p.read_text(encoding='utf-8'))
                      for key in ('last_video','last_attempted_video'):
                          v=str(s.get(key,'')).strip()
                          if v: names.append(v)
                  except Exception: pass
          print('|'.join(dict.fromkeys(names)))
          PY
          )
          echo "CROSS_PLATFORM_EXCLUDES=$cross" >> "$GITHUB_ENV"
          cp state_tiktok.json state.json

      - name: Escolher vídeo exclusivo
        id: videos
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -e
          rm -rf videos && mkdir -p videos
          gdown "$GDRIVE_FOLDER_URL" --folder --json > /tmp/all-drive-files.json
          python select_video.py /tmp/all-drive-files.json > /tmp/selected.json
          count=$(jq -r '.count' /tmp/selected.json)
          if [ "$count" -eq 0 ]; then echo "has_videos=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          url=$(jq -r '.url' /tmp/selected.json)
          filename=$(jq -r '.name' /tmp/selected.json)
          idx=$(jq -r '.index' /tmp/selected.json)
          gdown "$url" -O "videos/$filename"
          echo "has_videos=true" >> "$GITHUB_OUTPUT"
          echo "total_videos=$count" >> "$GITHUB_OUTPUT"
          echo "selected_video_index=$idx" >> "$GITHUB_OUTPUT"

      - name: Analisar vídeo
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: python analyze_video.py
      - name: Aplicar estilo
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: |
          python apply_style_overrides.py
          python adaptive_placement.py
      - name: Renderizar
        id: render
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        env:
          TOTAL_VIDEOS: ${{ steps.videos.outputs.total_videos }}
          SELECTED_VIDEO_INDEX: ${{ steps.videos.outputs.selected_video_index }}
        run: python render.py
      - name: Revisar qualidade
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: python quality_gate.py

      - name: Hospedar vídeo
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/tiktok-media-host && mkdir -p /tmp/tiktok-media-host
          cp output/reel.mp4 /tmp/tiktok-media-host/latest.mp4
          cd /tmp/tiktok-media-host
          git init
          git config user.name "Carlos TikTok Automation"
          git config user.email "actions@users.noreply.github.com"
          git add latest.mp4 && git commit -m "latest tiktok"
          git branch -M media-host-tiktok
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin media-host-tiktok

      - name: Publicar automaticamente no TikTok via Buffer
        id: publish
        continue-on-error: true
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          PUBLIC_VIDEO_URL: https://raw.githubusercontent.com/${{ github.repository }}/media-host-tiktok/latest.mp4?run=${{ github.run_id }}
        run: python publish_tiktok.py

      - name: Salvar estado do TikTok
        if: always() && steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          tmpdir=$(mktemp -d)
          [ -f tiktok-diagnostic.json ] && cp tiktok-diagnostic.json "$tmpdir/tiktok-diagnostic.json" || true
          # Em falha de render, render.py registra o vídeo bloqueado em state.json.
          # Promova esse estado para impedir que a recuperação tente o mesmo vídeo.
          if [ "${{ steps.render.outcome }}" = "failure" ] && [ -f state.json ]; then
            cp state.json "$tmpdir/state_tiktok.json"
          elif [ -f state_tiktok.json ]; then
            cp state_tiktok.json "$tmpdir/state_tiktok.json"
          fi
          [ -f quality-report.json ] && cp quality-report.json "$tmpdir/tiktok-quality-report.json" || true
          printf '{"run_id":"%s","finished_at":"%s","publish_outcome":"%s"}\n' "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" "${{ steps.publish.outcome }}" > "$tmpdir/tiktok-run-status.json"
          git config user.name "Carlos TikTok Automation"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            [ -f "$tmpdir/tiktok-diagnostic.json" ] && cp "$tmpdir/tiktok-diagnostic.json" tiktok-diagnostic.json || true
            [ -f "$tmpdir/state_tiktok.json" ] && cp "$tmpdir/state_tiktok.json" state_tiktok.json || true
            [ -f "$tmpdir/tiktok-quality-report.json" ] && cp "$tmpdir/tiktok-quality-report.json" tiktok-quality-report.json || true
            cp "$tmpdir/tiktok-run-status.json" tiktok-run-status.json
            git add tiktok-run-status.json
            [ -f state_tiktok.json ] && git add state_tiktok.json || true
            [ -f tiktok-diagnostic.json ] && git add tiktok-diagnostic.json || true
            [ -f tiktok-quality-report.json ] && git add tiktok-quality-report.json || true
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Finalizar TikTok $GITHUB_RUN_ID [skip ci]"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Falha ao salvar estado após três tentativas." >&2
          exit 1
      - name: Falhar se publicação falhou
        if: steps.publish.outcome == 'failure'
        run: exit 1

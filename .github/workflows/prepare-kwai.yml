name: Kwai a cada hora

on:
  schedule:
    # Uma publicação por hora. Minuto 52 evita encostar nas execuções do Instagram (:07) e TikTok (:37).
    - cron: '52 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.trigger-kwai'

permissions:
  contents: write

concurrency:
  group: kwai-server-api-hourly
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GDRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1sVLfUVK2FgssbqEEQeUrrUT5z9WluAin
      # Pausado para manter somente Instagram principal e TikTok ativos.
      KWAI_AUTOMATION_PAUSED: 'true'
      # A publicação só ocorre se as credenciais oficiais e user_video_publish forem válidas.
      KWAI_API_ENABLED: 'true'
      PLATFORM: kwai
      KWAI_APP_ID: ${{ secrets.KWAI_APP_ID }}
      KWAI_APP_SECRET: ${{ secrets.KWAI_APP_SECRET }}
      KWAI_INITIAL_REFRESH_TOKEN: ${{ secrets.KWAI_INITIAL_REFRESH_TOKEN }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar ativação
        id: gate
        shell: bash
        run: |
          if [ "$KWAI_AUTOMATION_PAUSED" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Kwai pausado."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Python
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências de edição e API
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core jq tesseract-ocr
          sudo apt-get install -y fonts-montserrat || true
          sudo apt-get install -y tesseract-ocr-por tesseract-ocr-eng || true
          pip install -r requirements.txt

      - name: Preparar estado exclusivo e exclusões do Kwai
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          cross=$(python - <<'PY'
          import json
          from pathlib import Path
          names = []
          for filename in ("state.json", "state_tiktok.json"):
              path = Path(filename)
              if path.exists():
                  try:
                      value = str(json.loads(path.read_text(encoding="utf-8")).get("last_video", "")).strip()
                      if value:
                          names.append(value)
                  except Exception:
                      pass
          print("|".join(dict.fromkeys(names)))
          PY
          )
          echo "CROSS_PLATFORM_EXCLUDES=$cross" >> "$GITHUB_ENV"
          cp state_kwai.json state.json

      - name: Escolher e baixar um vídeo diferente das outras plataformas
        id: videos
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -e
          rm -rf videos && mkdir -p videos
          gdown "$GDRIVE_FOLDER_URL" --folder --json > /tmp/all-drive-files.json
          python select_video.py /tmp/all-drive-files.json > /tmp/selected.json
          count=$(jq -r '.count' /tmp/selected.json)
          echo "Vídeos únicos disponíveis: $count"
          if [ "$count" -eq 0 ]; then
            echo "has_videos=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url=$(jq -r '.url' /tmp/selected.json)
          filename=$(jq -r '.name' /tmp/selected.json)
          idx=$(jq -r '.index' /tmp/selected.json)
          echo "Selecionado [$((idx+1))/$count]: $filename"
          gdown "$url" -O "videos/$filename"
          echo "has_videos=true" >> "$GITHUB_OUTPUT"
          echo "total_videos=$count" >> "$GITHUB_OUTPUT"
          echo "selected_video_index=$idx" >> "$GITHUB_OUTPUT"

      - name: Ler texto, tema e rosto do vídeo
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: python analyze_video.py

      - name: Aplicar voz autoral e posição segura da frase
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: python apply_style_overrides.py

      - name: Procurar posição segura adaptativamente
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: python adaptive_placement.py

      - name: Renderizar preservando rosto e substituindo texto antigo
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        env:
          TOTAL_VIDEOS: ${{ steps.videos.outputs.total_videos }}
          SELECTED_VIDEO_INDEX: ${{ steps.videos.outputs.selected_video_index }}
        run: python render.py

      - name: Revisar rosto, enquadramento, duplicação e linguagem
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: python quality_gate.py

      - name: Adaptar legenda e hashtags para Kwai
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: python prepare_kwai_payload.py

      - name: Conferir credenciais da API
        id: api
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        shell: bash
        run: |
          if [ "$KWAI_API_ENABLED" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "API Kwai desabilitada; fila não será consumida."
            exit 0
          fi
          if [ -z "$KWAI_APP_ID" ] || [ -z "$KWAI_APP_SECRET" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Credenciais KWAI_APP_ID/KWAI_APP_SECRET ausentes."
            exit 1
          fi
          if [ ! -f kwai-token-state.enc ] && [ -z "$KWAI_INITIAL_REFRESH_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Token inicial do Kwai ausente."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Publicar no Kwai pela API oficial
        id: publish
        if: steps.api.outputs.ready == 'true'
        run: python publish_kwai_api.py

      - name: Salvar estado, qualidade, token criptografado e diagnóstico
        if: always() && steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          tmpdir=$(mktemp -d)
          [ -f state_kwai.json ] && cp state_kwai.json "$tmpdir/state_kwai.json" || true
          [ -f kwai-token-state.enc ] && cp kwai-token-state.enc "$tmpdir/kwai-token-state.enc" || true
          [ -f kwai-payload.json ] && cp kwai-payload.json "$tmpdir/kwai-payload.json" || true
          [ -f kwai-publish-result.json ] && cp kwai-publish-result.json "$tmpdir/kwai-publish-result.json" || true
          [ -f quality-report.json ] && cp quality-report.json "$tmpdir/kwai-quality-report.json" || true
          printf '{"run_id":"%s","finished_at":"%s","has_videos":"%s","api_ready":"%s","publish_outcome":"%s"}\n' \
            "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" "${{ steps.videos.outputs.has_videos }}" "${{ steps.api.outputs.ready }}" "${{ steps.publish.outcome }}" \
            > "$tmpdir/kwai-run-status.json"

          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"

          [ -f "$tmpdir/state_kwai.json" ] && cp "$tmpdir/state_kwai.json" state_kwai.json || true
          [ -f "$tmpdir/kwai-token-state.enc" ] && cp "$tmpdir/kwai-token-state.enc" kwai-token-state.enc || true
          [ -f "$tmpdir/kwai-payload.json" ] && cp "$tmpdir/kwai-payload.json" kwai-payload.json || true
          [ -f "$tmpdir/kwai-publish-result.json" ] && cp "$tmpdir/kwai-publish-result.json" kwai-publish-result.json || true
          [ -f "$tmpdir/kwai-quality-report.json" ] && cp "$tmpdir/kwai-quality-report.json" kwai-quality-report.json || true
          cp "$tmpdir/kwai-run-status.json" kwai-run-status.json

          [ -f state_kwai_pending.json ] && rm -f state_kwai_pending.json || true

          git config user.name "Carlos Kwai Automation"
          git config user.email "actions@users.noreply.github.com"
          [ -f state_kwai.json ] && git add state_kwai.json || true
          [ -f kwai-token-state.enc ] && git add kwai-token-state.enc || true
          [ -f kwai-payload.json ] && git add kwai-payload.json || true
          [ -f kwai-publish-result.json ] && git add kwai-publish-result.json || true
          [ -f kwai-quality-report.json ] && git add kwai-quality-report.json || true
          git add kwai-run-status.json

          if ! git diff --cached --quiet; then
            git commit -m "Finalizar Kwai server-side $GITHUB_RUN_ID [skip ci]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

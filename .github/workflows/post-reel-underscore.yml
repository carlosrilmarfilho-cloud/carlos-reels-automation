name: Postar 7 Trial Reels no Instagram com underline

on:
  schedule:
    # 08:17, 10:17, 12:17, 14:17, 16:17, 18:17 e 20:17 em Fortaleza/Brasília (UTC-3)
    - cron: '17 11,13,15,17,19,21,23 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.trigger-underscore'

permissions:
  contents: write

concurrency:
  group: instagram-reels-underscore-seven-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GDRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1sVLfUVK2FgssbqEEQeUrrUT5z9WluAin
      AUTOMATION_PAUSED: 'false'
      PLATFORM: instagram_underscore
      FIXED_OVERLAY_TEXT: 'Tá aí a terapia que você precisa 🪗🎶❤️'
      EXPECTED_INSTAGRAM_USERNAME: '_carlosrilmarfilho'

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar ativação e conta correta
        id: gate
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_UNDERSCORE }}
        shell: bash
        run: |
          if [ "$AUTOMATION_PAUSED" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Publicação pausada."
            exit 0
          fi
          if [ -z "$INSTAGRAM_ACCESS_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Secret INSTAGRAM_ACCESS_TOKEN_UNDERSCORE ainda não configurado."
            exit 0
          fi
          python - <<'PY'
          import os, requests
          token = os.environ['INSTAGRAM_ACCESS_TOKEN']
          expected = os.environ['EXPECTED_INSTAGRAM_USERNAME']
          response = requests.get(
              'https://graph.instagram.com/v26.0/me',
              params={'fields': 'id,username', 'access_token': token},
              timeout=30,
          )
          response.raise_for_status()
          data = response.json()
          username = str(data.get('username', ''))
          if username != expected:
              raise SystemExit(f'Token pertence a @{username}, mas este workflow só aceita @{expected}.')
          print(f'Conta confirmada: @{username}')
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Python
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências de edição
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core jq tesseract-ocr
          sudo apt-get install -y fonts-montserrat || true
          sudo apt-get install -y tesseract-ocr-por tesseract-ocr-eng || true
          pip install -r requirements.txt
          pip install pilmoji emoji

      - name: Isolar estado do Instagram com underline
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          cp state.json /tmp/state-main-instagram.json
          cp state_instagram_underscore.json state.json
          style=$(jq -r '.posts_total // 0' state.json)
          echo "FIXED_STYLE_INDEX=$((style % 7))" >> "$GITHUB_ENV"

      - name: Escolher e baixar vídeo da rotação
        id: videos
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -e
          rm -rf videos && mkdir -p videos
          gdown "$GDRIVE_FOLDER_URL" --folder --json > /tmp/all-drive-files.json
          cross=$(python - <<'PY'
          import json
          from pathlib import Path
          names = []
          for filename in ('/tmp/state-main-instagram.json', 'state_tiktok.json', 'state_kwai.json'):
              path = Path(filename)
              if path.exists():
                  try:
                      value = str(json.loads(path.read_text(encoding='utf-8')).get('last_video', '')).strip()
                      if value:
                          names.append(value)
                  except Exception:
                      pass
          print('|'.join(dict.fromkeys(names)))
          PY
          )
          CROSS_PLATFORM_EXCLUDES="$cross" python select_video.py /tmp/all-drive-files.json > /tmp/selected.json
          count=$(jq -r '.count' /tmp/selected.json)
          echo "Vídeos únicos disponíveis: $count"
          if [ "$count" -eq 0 ]; then
            echo "has_videos=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url=$(jq -r '.url' /tmp/selected.json)
          filename=$(jq -r '.name' /tmp/selected.json)
          idx=$(jq -r '.index' /tmp/selected.json)
          echo "Selecionado [$((idx+1))/$count]: $filename"
          gdown "$url" -O "videos/$filename"
          echo "has_videos=true" >> "$GITHUB_OUTPUT"
          echo "total_videos=$count" >> "$GITHUB_OUTPUT"
          echo "selected_video_index=$idx" >> "$GITHUB_OUTPUT"

      - name: Ler texto e tema do vídeo
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: python analyze_video.py

      - name: Aplicar regras visuais seguras
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: |
          python apply_style_overrides.py
          python adaptive_placement.py
          python prepare_fixed_instagram.py

      - name: Renderizar frase fixa com legenda e hashtags variáveis
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        env:
          TOTAL_VIDEOS: ${{ steps.videos.outputs.total_videos }}
          SELECTED_VIDEO_INDEX: ${{ steps.videos.outputs.selected_video_index }}
        run: python render.py

      - name: Revisar rosto, enquadramento e texto
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        run: python quality_gate.py

      - name: Hospedar vídeo temporário separado
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/media-host-underscore && mkdir -p /tmp/media-host-underscore
          cp output/reel.mp4 /tmp/media-host-underscore/latest.mp4
          cd /tmp/media-host-underscore
          git init
          git config user.name "Carlos Reels Automation"
          git config user.email "actions@users.noreply.github.com"
          git add latest.mp4 && git commit -m "latest reel underscore"
          git branch -M media-host-underscore
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin media-host-underscore

      - name: Publicar Trial Reel no @_carlosrilmarfilho
        id: publish
        continue-on-error: true
        if: steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_UNDERSCORE }}
          IG_API_VERSION: v26.0
          TRIAL_REEL: true
          PUBLIC_VIDEO_URL: https://raw.githubusercontent.com/${{ github.repository }}/media-host-underscore/latest.mp4?run=${{ github.run_id }}
        run: python publish.py

      - name: Salvar estado separado e diagnóstico
        if: always() && steps.gate.outputs.ready == 'true' && steps.videos.outputs.has_videos == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          cp state.json state_instagram_underscore.json
          [ -f diagnostic.json ] && cp diagnostic.json diagnostic_instagram_underscore.json || true
          [ -f quality-report.json ] && cp quality-report.json quality-report-instagram-underscore.json || true
          printf '{"run_id":"%s","finished_at":"%s","publish_outcome":"%s"}\n' "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" "${{ steps.publish.outcome }}" > run-status-instagram-underscore.json

          for f in state.json diagnostic.json quality-report.json render.py viral_copy.json video_profiles.json; do
            git checkout -- "$f" 2>/dev/null || true
          done

          git config user.name "Carlos Reels Automation"
          git config user.email "actions@users.noreply.github.com"
          git add state_instagram_underscore.json run-status-instagram-underscore.json
          [ -f diagnostic_instagram_underscore.json ] && git add diagnostic_instagram_underscore.json || true
          [ -f quality-report-instagram-underscore.json ] && git add quality-report-instagram-underscore.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar @_carlosrilmarfilho $GITHUB_RUN_ID [skip ci]"
            git reset --hard HEAD
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Falhar se a publicação falhou
        if: steps.publish.outcome == 'failure'
        run: exit 1
